version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A package published less than two weeks ago is not offered. Compromised
    # releases are typically caught and unpublished within days, and this library
    # gains nothing from being early. Security updates bypass the cooldown.
    cooldown:
      default-days: 14
      semver-major-days: 14
      semver-minor-days: 14
      semver-patch-days: 14
    groups:
      # One pull request per toolchain instead of one per package: these move
      # together and reviewing them apart wastes time.
      types:
        patterns:
          - '@types/*'
      jest:
        patterns:
          - jest
          - jest-*
          - ts-jest
          - '@types/jest'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
          - '@testing-library/*'
      build-tooling:
        patterns:
          - vite
          - '@vitejs/*'
          - typescript
          - '@biomejs/*'
      release-tooling:
        patterns:
          - release-it
          - '@release-it/*'
          - dotenv-cli
    ignore:
      # ts-jest@29.4.12 declares `"typescript": ">=4.3 <7"`, so the tool the whole
      # test suite runs on rules the 7 line out itself: taking it would need
      # `--legacy-peer-deps` or an `overrides` entry, and neither is allowed here.
      # Remove this once ts-jest widens that range.
      - dependency-name: typescript
        update-types:
          - 'version-update:semver-major'
    open-pull-requests-limit: 5
    commit-message:
      # Conventional commits drive the released version, so dependency updates
      # must not read as features or fixes.
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
