name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CI: true

jobs:
  lint:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
          check-latest: true
          node-version-file: '.node-version'

      - name: Cache dependencies
        id: npm-cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

  test:
    needs: [lint]
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
          check-latest: true
          node-version-file: '.node-version'

      - name: Cache dependencies
        id: npm-cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # ts-jest transpiles per file without type-checking, so a type error in a
      # test would otherwise reach main unnoticed.
      - name: Type check
        run: npm run typecheck

      - name: Run jest tests
        run: npm run test

      # The suite above runs in declaration order, which is the one order that
      # cannot expose a test depending on a sibling having run first. The storage
      # mocks are module-level and record every call, so that dependency is a
      # standing risk here rather than a hypothetical one — `clearMocks` in
      # jest.config.js exists because of it, and nothing else in CI would notice
      # if it were removed.
      #
      # The seed is left random rather than pinned to a list: a list can only
      # re-find the orderings it already found, and the orderings worth finding
      # are the ones nobody has enumerated. `--showSeed` prints the seed it used,
      # so a failure here is replayed exactly with
      # `npx jest --randomize --seed=<printed>`.
      #
      # The cost, knowingly accepted: this step can go red on a change that did
      # not introduce the ordering it tripped over. That is the guard working —
      # the defect is the order dependence, wherever it came from — but it will
      # happen to someone who did not cause it.
      - name: Run jest tests in random order
        run: npm run test:random

  build:
    needs: [test]
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        cache: 'npm'
        cache-dependency-path: 'package-lock.json'
        check-latest: true
        node-version-file: '.node-version'

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: ${{ runner.os }}-npm-

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build
      run: npm run build --if-present

    # A packed-tarball smoke matrix, the wrapper declarations, publint and attw:
    # the ESM wrappers and the exports map are hand-written, so only a real pack
    # proves they resolve. Runs after Build because it checks the output.
    # See docs/packaging.md.
    - name: Verify package exports
      run: npm run check:package

    - name: Upload packages
      uses: actions/upload-artifact@v7
      with:
        name: lib-${{ matrix.os }}
        path: lib
        retention-days: 30
