name: Release

# npm trusted publishing is bound to this filename.
# Pushes to main release only histories accepted by whatBump in .release-it.js.
# Publishing waits for the release commit and tag to reach origin/main.
on:
  push:
    branches:
      - main
  # Kept beside the automatic trigger for what a push cannot express: forcing an increment the
  # history understates, and rehearsing the pipeline with --dry-run. It is also the only way to
  # retry a release whose commits already sit on main, after an outage at npm or GitHub, without
  # inventing an empty commit to push.
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment. Leave as "auto" to derive it from conventional commits.'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      # Retry the tagged version because OIDC publishing is available only in this workflow.
      retry-current:
        description: 'Finish the release for the version already tagged, instead of deriving a new one.'
        required: false
        type: boolean
        default: false
      dry-run:
        description: 'Run the whole release without publishing or pushing anything.'
        required: false
        type: boolean
        default: false

# Queue releases so concurrent runs cannot derive and publish the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # Create the GitHub release; the push uses the deploy key below.
  contents: write
  # Authorize npm trusted publishing over OIDC.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # npm requires this environment claim in the OIDC token.
    environment: npm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Version derivation needs the complete commit history.
          fetch-depth: 0
          # The branch ruleset grants this deploy key permission to push the release commit.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Release
        # NODE_AUTH_TOKEN would make npm prefer legacy authentication over OIDC.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          RETRY_CURRENT: ${{ inputs.retry-current }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()

          # Retrying targets the version already tagged, so an increment would contradict it.
          # The inputs are all empty on any event other than workflow_dispatch, and testing
          # against 'auto' alone would hand release-it an empty positional argument, which is
          # why the emptiness is checked first.
          if [ "$RETRY_CURRENT" = 'true' ]; then
            args+=('--no-increment')
          elif [ -n "$INCREMENT" ] && [ "$INCREMENT" != 'auto' ]; then
            args+=("$INCREMENT")
          fi

          if [ "$DRY_RUN" = 'true' ]; then
            args+=('--dry-run')
          fi

          npx release-it "${args[@]}" --ci
