name: Release

# DO NOT RENAME THIS FILE. The npm trusted publisher for this package names release.yml as the
# workflow allowed to publish; under any other name OIDC publishing stops working.
#
# Every push to main is a release candidate; the commits decide whether it becomes one. The
# whatBump in .release-it.js returns no version for a history that earns nothing, so a merge
# carrying only dependency bumps ends in "No new version to release" and exit 0. That is the
# property this trigger rests on, and it is measurable: run release-it over a chore-only
# history and read what it plans. It is stated locally rather than inherited because the
# preset's default has flipped between its versions — see .agents/rules/project-overview.md.
#
# release-it commits the version bump and the changelog, tags them, pushes both back to main, and
# only then publishes to npm and opens the GitHub release. Nothing reaches the registry until the
# push has succeeded, because a published version cannot be taken back and a failed push can be
# retried — see npm.publish in .release-it.js.
#
# That push carries `[skip ci]` in the commit message, which is what keeps the release from
# triggering itself — see the commitMessage in .release-it.js for why that marker is load-bearing
# here and not merely tidy.
on:
  push:
    branches:
      - main
  # Kept beside the automatic trigger for what a push cannot express: forcing an increment the
  # history understates, and rehearsing the pipeline with --dry-run. It is also the only way to
  # retry a release whose commits already sit on main, after an outage at npm or GitHub, without
  # inventing an empty commit to push.
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment. Leave as "auto" to derive it from conventional commits.'
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      dry-run:
        description: 'Run the whole release without publishing or pushing anything.'
        required: false
        type: boolean
        default: false

# One release at a time, across the whole repository. Two runs started close together
# would otherwise derive their versions from the same history and race to tag and
# publish. Queueing is right and cancelling is not: a run interrupted between the npm
# publish and the tag push leaves a version on the registry that no commit points at.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # Needed to create the GitHub release. The push to main does not go through this token — see the
  # deploy key on the checkout step.
  contents: write
  # Needed for npm OIDC trusted publishing, which replaces a stored NPM_TOKEN.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The npm trusted publisher for this package names `npm` as its environment, and the OIDC
    # token carries the environment claim only when the job opts into one. Without this line
    # the claim is absent and npm rejects the publish.
    environment: npm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # @release-it/conventional-changelog derives the version from history.
          fetch-depth: 0
          # Checks out over SSH and leaves the key in the local git config, so release-it's push
          # goes out as the deploy key. That actor is what the branch ruleset grants a bypass;
          # the built-in github-actions[bot] cannot be given one, so GITHUB_TOKEN cannot push to
          # main however its permissions are set. `persist-credentials` defaults to true, which
          # is what keeps the key configured for the later push.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Configure git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Release
        # NODE_AUTH_TOKEN is deliberately absent: npm falls back to the legacy
        # token path whenever it is set, instead of using OIDC.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ inputs.increment }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()

          # Both inputs are empty on any event other than workflow_dispatch. Testing
          # against 'auto' alone would hand release-it an empty positional argument,
          # which is why the emptiness is checked first.
          if [ -n "$INCREMENT" ] && [ "$INCREMENT" != 'auto' ]; then
            args+=("$INCREMENT")
          fi

          if [ "$DRY_RUN" = 'true' ]; then
            args+=('--dry-run')
          fi

          npx release-it "${args[@]}" --ci
